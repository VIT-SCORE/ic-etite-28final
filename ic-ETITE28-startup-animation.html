<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ic-ETITE’28 — Startup Animation</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7
    }

    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: introExit .9s cubic-bezier(.77, 0, .18, 1) 2.85s forwards;
    }

    .stage {
      position: relative;
      width: min(86vw, 1100px);
      height: min(34vw, 390px);
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame {
      position: absolute;
      inset: 0;
      border: 1.5px solid rgba(25, 25, 25, .72);
      clip-path: inset(0 50% 0 50%);
      animation: frameOpen 1.05s cubic-bezier(.77, 0, .18, 1) .12s forwards,
        frameClose .82s cubic-bezier(.77, 0, .18, 1) 2.02s forwards;
    }

    .frame:before,
    .frame:after {
      content: "";
      position: absolute;
      background: #ff0050;
      opacity: 0;
    }

    .frame:before {
      width: 42px;
      height: 1px;
      left: 50%;
      top: -1px;
      transform: translateX(-50%);
      animation: accentTop .6s ease 1s forwards;
    }

    .frame:after {
      width: 1px;
      height: 42px;
      left: -1px;
      top: 50%;
      transform: translateY(-50%);
      animation: accentSide .6s ease 1s forwards;
    }

    .logo-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .subtitle {
      margin-top: 12px;
      color: #333;
      font-size: clamp(10px, 1.35vw, 17px);
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      animation: subtitleIn .8s cubic-bezier(.16, 1, .3, 1) .78s forwards,
        subtitleOut .55s cubic-bezier(.77, 0, .18, 1) 2.18s forwards;
    }

    .logo {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: baseline;
      justify-content: center;
      white-space: nowrap;
      letter-spacing: -.075em;
      transform: translateY(14px) scale(.94);
      opacity: 0;
      animation: logoIn 1.05s cubic-bezier(.16, 1, .3, 1) .52s forwards,
        logoOut .72s cubic-bezier(.77, 0, .18, 1) 2.05s forwards;
      filter: drop-shadow(0 0 0 rgba(255, 0, 80, 0));
    }

    .logo .ic {
      color: #ff0050;
      font-size: clamp(42px, 7vw, 92px);
      font-weight: 300
    }

    .logo .dash {
      color: #181818;
      font-size: clamp(38px, 6vw, 82px);
      font-weight: 300;
      margin: 0 .01em
    }

    .logo .e {
      color: #181818;
      font-size: clamp(48px, 7.5vw, 100px);
      font-weight: 700
    }

    .logo .t {
      color: #ff0050;
      font-size: clamp(48px, 7.5vw, 100px);
      font-weight: 800
    }

    .logo .i {
      color: #181818;
      font-size: clamp(48px, 7.5vw, 100px);
      font-weight: 500
    }

    .logo .apostrophe {
      color: #181818;
      font-size: clamp(36px, 5.5vw, 76px);
      font-weight: 500;
      margin-left: .02em
    }

    .logo .year {
      color: #181818;
      font-size: clamp(45px, 7vw, 94px);
      font-weight: 500;
      letter-spacing: -.09em
    }

    .logo:after {
      content: "";
      position: absolute;
      width: 25%;
      height: 120%;
      top: -10%;
      left: -30%;
      background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .45), transparent);
      transform: skewX(-18deg);
      opacity: 0;
      animation: shine 1s ease 1.22s forwards;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ff0050;
      opacity: 0;
    }

    .dot.one {
      left: 7%;
      top: 28%;
      animation: dotIn .6s ease 1.05s forwards
    }

    .dot.two {
      right: 8%;
      bottom: 26%;
      animation: dotIn .6s ease 1.15s forwards
    }

    .home {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 0, 80, .06), transparent 35%),
        #f7f7f7;
      color: #181818;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .home h1 {
      font-size: clamp(32px, 6vw, 76px);
      font-weight: 300;
      letter-spacing: -.04em;
      margin: 0
    }

    .home span {
      color: #ff0050
    }

    @keyframes frameOpen {
      0% {
        clip-path: inset(0 50% 0 50%);
        transform: scaleX(.72);
        opacity: 0
      }

      20% {
        opacity: 1
      }

      100% {
        clip-path: inset(0 0 0 0);
        transform: scaleX(1);
        opacity: 1
      }
    }

    @keyframes frameClose {
      0% {
        clip-path: inset(0 0 0 0);
        transform: scaleX(1);
        opacity: 1
      }

      100% {
        clip-path: inset(0 50% 0 50%);
        transform: scaleX(.72);
        opacity: 0
      }
    }

    @keyframes logoIn {
      0% {
        opacity: 0;
        transform: translateY(22px) scale(.88);
        filter: blur(8px)
      }

      65% {
        opacity: 1;
        filter: blur(0)
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0)
      }
    }

    @keyframes logoOut {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1)
      }

      100% {
        opacity: 0;
        transform: translateY(-8px) scale(.94);
        filter: blur(3px)
      }
    }

    @keyframes subtitleIn {
      0% {
        opacity: 0;
        transform: translateY(8px)
      }

      100% {
        opacity: .88;
        transform: translateY(0)
      }
    }

    @keyframes subtitleOut {
      0% {
        opacity: .88;
        transform: translateY(0)
      }

      100% {
        opacity: 0;
        transform: translateY(-5px)
      }
    }

    @keyframes shine {
      0% {
        left: -30%;
        opacity: 0
      }

      15% {
        opacity: 1
      }

      100% {
        left: 115%;
        opacity: 0
      }
    }

    @keyframes accentTop {
      0% {
        opacity: 0;
        transform: translateX(-50%) scaleX(0)
      }

      100% {
        opacity: 1;
        transform: translateX(-50%) scaleX(1)
      }
    }

    @keyframes accentSide {
      0% {
        opacity: 0;
        transform: translateY(-50%) scaleY(0)
      }

      100% {
        opacity: 1;
        transform: translateY(-50%) scaleY(1)
      }
    }

    @keyframes dotIn {
      0% {
        opacity: 0;
        transform: scale(0)
      }

      100% {
        opacity: .7;
        transform: scale(1)
      }
    }

    @keyframes introExit {
      0% {
        opacity: 1
      }

      100% {
        opacity: 0;
        visibility: hidden;
        pointer-events: none
      }
    }

    @media(max-width:600px) {
      .stage {
        width: 90vw;
        height: 46vw;
        min-height: 150px
      }

      .frame {
        border-width: 1px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      #intro,
      .frame,
      .logo,
      .dot.one,
      .dot.two,
      .frame:before,
      .frame:after,
      .logo:after {
        animation: none
      }

      #intro {
        opacity: 0;
        visibility: hidden
      }
    }
  </style>
</head>

<body>

  <div class="home">
    <h1>Welcome to <span>ic-ETITE’28</span></h1>
  </div>

  <div id="intro">
    <div class="stage">
      <div class="frame"></div>
      <div class="dot one"></div>
      <div class="dot two"></div>

      <div class="logo-wrap">
        <div class="logo" aria-label="ic-ETITE 28">
          <span class="ic">ic</span><span class="dash">-</span><span class="e">E</span><span class="t">T</span><span
            class="i">I</span><span class="t">T</span><span class="e">E</span><span class="apostrophe">’</span><span
            class="year">28</span>
        </div>
        <div class="subtitle">SCORE VIT VELLORE</div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("load", () => {
      const intro = document.getElementById("intro");
      const restart = () => {
        intro.style.animation = "none";
        void intro.offsetWidth;
        intro.style.animation = "";
      };
      window.restartIntro = restart;
    });
  </script>
</body>

</html>
